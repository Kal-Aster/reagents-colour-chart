# Pubblica la pagina su GitHub Pages a ogni push su master.
#
# Il file unico (dist/) non e' nel repository: lo costruisce tools/bundle.py,
# e il pulsante "Scarica" della pagina lo trova accanto a index.html. Sul
# sito va solo cio' che serve alla pagina: documenti e script restano nel
# repository.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# una pubblicazione alla volta: quella nuova sostituisce quella in corso
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # facoltativo: senza, il file unico resta valido ma non minimizzato
      - run: pip install rjsmin

      - run: python3 tools/bundle.py

      - run: |
          mkdir site
          cp -r index.html assets data dist site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
